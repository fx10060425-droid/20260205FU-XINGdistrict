<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復興區公所人事室宣導專區</title>
    <style>
        /* 基礎設定，使用溫柔的背景色 */
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: #fdf8f5; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 圖片外框的卡片設計 */
        .poster-card {
            max-width: 800px; /* 電腦版不會放得無限大 */
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        /* 標題樣式 */
        .poster-card h2 {
            text-align: center;
            color: #5c434f;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px dashed #eedce3;
            padding-bottom: 10px;
        }

        /* 確保圖片在手機上會自動縮放 */
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="poster-card">
        <h2>拒絕職場霸凌，共建友善工作環境</h2>
        <img src="images/bullying.jpg" alt="職場霸凌防治宣導圖">
    </div>

    <div class="poster-card">
        <h2>公務人員執行職務安全及衛生防護</h2>
        <img src="images/safety.jpg" alt="安全與衛生防護宣導圖">
    </div>

</body>
</html>
